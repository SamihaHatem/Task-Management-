<app-tasks-header (createTask)="openTaskForm()"  />

@if (tasks.isLoading()) {
  <p>Loading tasks...</p>
} @else if (tasks.error()) {
  <p>Failed to load tasks.</p>
} @else {
  <app-task-filters
    [assignees]="assignees()"
    (filtersChange)="onFiltersChange($event)"
  />

  <app-task-board [tasks]="filteredTasks()"  (editTask)="openEditTaskForm($event)"   (deleteTask)="deleteTask($event)"/>
}
