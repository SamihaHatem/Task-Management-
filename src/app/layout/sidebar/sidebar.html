<aside class="sidebar">
  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon">
      <mat-icon>check_circle</mat-icon>
    </div>

    <span>Task Manager</span>
  </div>

  <!-- Navigation -->
  <mat-nav-list class="navigation">
    <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
      <mat-icon matListItemIcon>dashboard</mat-icon>
      <span matListItemTitle>Dashboard</span>
    </a>

    <a mat-list-item routerLink="/tasks" routerLinkActive="active">
      <mat-icon matListItemIcon>task_alt</mat-icon>
      <span matListItemTitle>Tasks</span>
    </a>

    <a mat-list-item routerLink="/calendar" routerLinkActive="active">
      <mat-icon matListItemIcon>calendar_month</mat-icon>
      <span matListItemTitle>Calendar</span>
    </a>

    <a mat-list-item routerLink="/analytics" routerLinkActive="active">
      <mat-icon matListItemIcon>analytics</mat-icon>
      <span matListItemTitle>Analytics</span>
    </a>

    <a mat-list-item routerLink="/team" routerLinkActive="active">
      <mat-icon matListItemIcon>group</mat-icon>
      <span matListItemTitle>Team</span>
    </a>

    <a mat-list-item routerLink="/settings" routerLinkActive="active">
      <mat-icon matListItemIcon>settings</mat-icon>
      <span matListItemTitle>Settings</span>
    </a>
  </mat-nav-list>

  <!-- New Task -->
  <button mat-flat-button color="primary" class="new-task-button">
    <mat-icon>add</mat-icon>
    New Task
  </button>
</aside>
